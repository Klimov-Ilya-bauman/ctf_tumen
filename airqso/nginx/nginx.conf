worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    # --- Basic settings ---
    sendfile        on;
    keepalive_timeout 30;
    client_max_body_size 16k;      # messages are max 2048 bytes, no big uploads needed
    client_body_buffer_size 16k;

    # --- Rate limiting zones ---
    # Per-IP: general requests
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # Per-IP: auth endpoints (login/register) — tight
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
    # Per-IP: QSO/broadcast creation
    limit_req_zone $binary_remote_addr zone=mutations:10m rate=10r/s;
    # Per-IP: WebSocket upgrades
    limit_req_zone $binary_remote_addr zone=ws:10m rate=2r/s;
    # Per-IP: operator objects (records/cards/routes/files — flag storage)
    limit_req_zone $binary_remote_addr zone=operator:10m rate=5r/s;
    # Per-IP: QSL/operator GET by UUID — anti-enumeration
    limit_req_zone $binary_remote_addr zone=objects:10m rate=3r/s;
    # Per-IP: connections
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # --- Logging ---
    log_format minimal '$remote_addr $request_method $uri $status $request_time';
    log_format detailed '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log minimal buffer=16k flush=5s;

    upstream backend {
        server web:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --- Connection limits ---
        limit_conn connlimit 20;

        # --- Block metrics/debug/admin paths ---
        location /metrics {
            return 403;
        }
        location /debug {
            return 403;
        }

        # --- Health check (no rate limit, checker needs it) ---
        location /health/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # --- Auth endpoints: tight rate limit against brute force ---
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            # Block path traversal
            if ($uri ~ \.\.) {
                return 400;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- WebSocket ---
        location /api/v1/ws {
            limit_req zone=ws burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- QSO creation / messages / broadcasts (mutations) ---
        location ~ ^/api/v1/(qsos|broadcasts)$ {
            limit_req zone=mutations burst=15 nodelay;
            limit_req_status 429;

            # Block path traversal
            if ($uri ~ \.\.) {
                return 400;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- Operator API (checker flag storage — strict rate limit + logging) ---
        location ~ ^/api/v1/operator/ {
            limit_req zone=operator burst=8 nodelay;
            limit_req_status 429;

            if ($uri ~ \.\.) {
                return 400;
            }

            access_log /var/log/nginx/operator.log detailed;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- QSL cards + object GETs by UUID (anti-enumeration) ---
        location ~ ^/api/v1/qsl/ {
            limit_req zone=objects burst=5 nodelay;
            limit_req_status 429;

            if ($uri ~ \.\.) {
                return 400;
            }

            access_log /var/log/nginx/operator.log detailed;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- QSO messages/routes by UUID (anti-enumeration) ---
        location ~ ^/api/v1/qsos/[^/]+/(messages|routes)$ {
            limit_req zone=objects burst=8 nodelay;
            limit_req_status 429;

            if ($uri ~ \.\.) {
                return 400;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- All other API ---
        location /api/ {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;

            # Block path traversal
            if ($uri ~ \.\.) {
                return 400;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # --- Static files (SPA) ---
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
        }

        # --- Block common attack paths ---
        location ~ /\. {
            return 403;
        }
        location ~ ~$ {
            return 403;
        }
    }
}
