services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      LISTEN_ADDR: 0.0.0.0:8000
      PHP_AUTH_INTERNAL_URL: http://php-auth:8080
      REPORTS_DIR: /data/reports
    volumes:
      - reports-data:/data/reports
    depends_on:
      mysql:
        condition: service_healthy
      php-auth:
        condition: service_started

  php-auth:
    build: ./php-auth
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REPORTS_DIR: /data/reports
    volumes:
      - reports-data:/data/reports
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      - backend
      - php-auth
    volumes:
      - reports-data:/data/reports

volumes:
  mysql-data:
  reports-data:
