[package]
name = "battleships-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dashmap = "6.2.1"
futures-util = "0.3.34"
jsonwebtoken = "9.3.0"
rand = "0.10.3"
reqwest = { version = "0.12.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "macros", "migrate"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
