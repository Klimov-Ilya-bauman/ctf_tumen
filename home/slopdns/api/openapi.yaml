      description: The caller must be owner or admin of target_org_id (403), and it must differ from the zone's current organization (422).
    ZoneTransfer:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        zone:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              $ref: '#/components/schemas/CanonicalZoneName'
          required:
          - id
          - name
          additionalProperties: false
        from_org_id:
          $ref: '#/components/schemas/Uuid'
        from_user:
          $ref: '#/components/schemas/UserRef'
        to_user:
          $ref: '#/components/schemas/UserRef'
        target_org_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Set when accepted.
        status:
          $ref: '#/components/schemas/ZoneTransferStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          description: created_at + 7 days. After it the status is expired.
        decided_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - zone
      - from_org_id
      - from_user
      - to_user
      - target_org_id
      - status
      - created_at
      - expires_at
      - decided_at
      additionalProperties: false
    RoleBinding:
