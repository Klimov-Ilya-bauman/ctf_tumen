    ApiToken:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/TokenName'
        kind:
          type: string
          enum:
          - user
          - service_account
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - name
      - kind
      - created_at
      - expires_at
      - last_used_at
      additionalProperties: false
      description: API token metadata. The secret is never returned after creation.
    CreatedApiToken:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/TokenName'
        kind:
          type: string
          enum:
          - user
          - service_account
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        token:
          type: string
          maxLength: 128
          pattern: ^sd(pat|sat)_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_[0-9A-Za-z]{43}$
          description: Bearer token <prefix>_<id>_<secret>, prefix sdpat (user) or sdsat (service account), secret = 32 random bytes in base62 (43 characters).
            Shown only once.
      required:
      - id
      - name
      - kind
      - created_at
      - expires_at
      - last_used_at
      - token
      additionalProperties: false
      description: API token metadata together with the secret. Returned only by token creation.
    UserTokenCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/TokenName'
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 90
          description: Lifetime in days. Ignored when no_expiry is true.
        no_expiry:
          type: boolean
          default: false
          description: Create a token without expiry.
        totp_code:
          allOf:
          - $ref: '#/components/schemas/TotpCode'
          description: Required when the user has TOTP enabled (401 mfa_invalid otherwise).
      required:
      - name
      additionalProperties: false
    ServiceAccountTokenCreate:
