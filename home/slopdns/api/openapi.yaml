      - $ref: '#/components/parameters/transfer_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /healthz:
    servers:
    - url: /
      description: Health endpoints are served at the root of every service, outside /api/v1.
    get:
      operationId: healthz
      summary: Liveness
      tags:
      - health
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      description: Liveness without external dependencies.
  /readyz:
    servers:
    - url: /
      description: Health endpoints are served at the root of every service, outside /api/v1.
    get:
      operationId: readyz
      summary: Readiness
      tags:
      - health
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      description: Readiness including dependencies.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: slopdns_session
      description: 'Session token sdses_..., set by login. 12 h sliding, 7 days absolute. Mutating requests require X-SlopDNS-CSRF: 1.'
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: sdpat_<id>_<secret> or sdsat_<id>_<secret>
      description: Personal API token or service account token.
  parameters:
    org_id:
      name: org_id
      in: path
      required: true
      description: Organization id.
      schema:
        $ref: '#/components/schemas/Uuid'
    zone_id:
      name: zone_id
      in: path
      required: true
      description: Zone id.
      schema:
        $ref: '#/components/schemas/Uuid'
    record_id:
      name: record_id
      in: path
      required: true
      description: Record id.
      schema:
        $ref: '#/components/schemas/Uuid'
    invitation_id:
      name: invitation_id
      in: path
      required: true
      description: Invitation id.
      schema:
        $ref: '#/components/schemas/Uuid'
    transfer_id:
      name: transfer_id
      in: path
      required: true
      description: Zone transfer id.
      schema:
        $ref: '#/components/schemas/Uuid'
    service_account_id:
      name: service_account_id
      in: path
      required: true
      description: Service account id.
      schema:
        $ref: '#/components/schemas/Uuid'
    token_id:
      name: token_id
      in: path
      required: true
      description: API token id.
      schema:
        $ref: '#/components/schemas/Uuid'
    binding_id:
      name: binding_id
      in: path
      required: true
      description: Role binding id.
      schema:
        $ref: '#/components/schemas/Uuid'
    user_id:
      name: user_id
      in: path
      required: true
      description: User id.
      schema:
        $ref: '#/components/schemas/Uuid'
    limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip.
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    csrf:
      name: X-SlopDNS-CSRF
      in: header
      required: false
      description: Must be exactly 1 on every mutating request authenticated with the session cookie (403 csrf_required otherwise). Not needed with a bearer token.
      schema:
        type: string
        const: '1'
    org_id_filter:
      name: org_id
      in: query
      required: false
      description: Restrict to one organization.
      schema:
        $ref: '#/components/schemas/Uuid'
    invitation_status:
      name: status
      in: query
      required: false
      description: Filter by status.
      schema:
        $ref: '#/components/schemas/InvitationStatus'
    resource_type_filter:
      name: resource_type
      in: query
      required: false
      description: Resource type; must be combined with resource_id.
      schema:
        $ref: '#/components/schemas/ResourceType'
    resource_id_filter:
      name: resource_id
      in: query
      required: false
      description: Resource id; must be combined with resource_type.
      schema:
        $ref: '#/components/schemas/Uuid'
    org_id_required:
      name: org_id
      in: query
      required: true
      description: Organization id.
      schema:
        $ref: '#/components/schemas/Uuid'
    zone_name_filter:
      name: name
      in: query
      required: false
      description: Substring of the zone name.
      schema:
        type: string
        minLength: 1
        maxLength: 254
        pattern: ^[^\s\\]+$
    record_name_filter:
      name: name
      in: query
      required: false
      description: Owner name (same syntax as OwnerName).
      schema:
        $ref: '#/components/schemas/OwnerName'
    record_type_filter:
      name: type
      in: query
      required: false
      description: Type mnemonic or TYPEnnn.
      schema:
        type: string
        minLength: 1
        maxLength: 10
        pattern: ^([A-Z]{1,10}|TYPE[1-9][0-9]{0,4})$
    transfer_direction:
      name: direction
      in: query
      required: false
      description: 'incoming: addressed to me. outgoing: zones I administer that are offered to others. Default: both.'
      schema:
        type: string
        enum:
        - incoming
        - outgoing
    transfer_status:
      name: status
      in: query
      required: false
      description: Filter by status.
      schema:
        $ref: '#/components/schemas/ZoneTransferStatus'
  responses:
    BadRequest:
      description: 'Malformed request: invalid JSON, unknown field, wrong content type, body too large (bad_request).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials (unauthenticated, invalid_credentials, mfa_invalid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted (forbidden, csrf_required).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Object does not exist or is not visible to the caller (not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Uniqueness or state conflict (conflict).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: A field, path parameter or query parameter violates a constraint (validation_failed, see error.field), or a configured quota is exceeded (quota_exceeded, see error.field).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded (per-principal limit of the gateway) or the IAM password hashing pool is saturated (rate_limited). Failed logins never cause 429.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A required internal dependency is unavailable, retry later (service_unavailable).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: Done.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthenticated
              - invalid_credentials
              - mfa_invalid
              - csrf_required
              - forbidden
              - not_found
              - conflict
              - validation_failed
              - quota_exceeded
              - rate_limited
              - internal_error
              - service_unavailable
              description: 'Machine-readable error code. bad_request: malformed JSON, unknown fields, wrong content type (400). unauthenticated: missing, invalid,
                expired or revoked token (401). invalid_credentials: wrong username/password (401). mfa_invalid: wrong or reused TOTP/recovery code or expired mfa_token
                (401). csrf_required: cookie-authenticated mutating request without X-SlopDNS-CSRF: 1 (403). forbidden: authenticated but not allowed (403). not_found:
                object does not exist or is not visible to the caller (404). conflict: uniqueness or state conflict (409). validation_failed: a field violates a constraint
                (422, see field). quota_exceeded: a configured limit is reached (422, see field): zones per organization, records per zone, zone size, organizations
                created per user, pending invitations per organization. rate_limited (429).'
            message:
              type: string
              minLength: 1
              maxLength: 1024
              description: Human-readable message (English).
            field:
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^[A-Za-z0-9_.\[\]-]+$
              description: Dotted path of the offending request field for 422 errors, e.g. name, data.address, data.strings[2], soa.refresh. Query parameters are
                reported by name.
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
      description: Uniform error envelope used by every non-2xx response.
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: UUIDv7 in lower-case canonical form.
    Timestamp:
      type: string
      format: date-time
      maxLength: 40
      description: RFC 3339 timestamp, UTC.
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9-]{2,31}$
      description: '3-32 characters: lower-case ASCII letters, digits and hyphens, starting with a letter or digit. Globally unique.'
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: 12-128 Unicode characters. Never returned.
    TotpCode:
      type: string
      pattern: ^[0-9]{6}$
      minLength: 6
      maxLength: 6
      description: Current RFC 6238 code (SHA-1, 6 digits, 30 s step, +-1 step window). A code whose step is not newer than the last accepted one is rejected.
    RecoveryCode:
      type: string
      pattern: ^[A-Za-z2-7]{16}$
      minLength: 16
      maxLength: 16
      description: 'One-time TOTP recovery code: 16 base32 characters (case-insensitive).'
    MfaToken:
      type: string
      maxLength: 128
      pattern: ^sdmfa_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_[0-9A-Za-z]{43}$
      description: Intermediate login token (prefix sdmfa), valid 5 minutes, single use.
    OrgName:
      type: string
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9][a-z0-9-]{2,62}$
      description: '3-63 characters: lower-case ASCII letters, digits and hyphens, starting with a letter or digit. A display label, not unique: organizations are identified by id.'
    ServiceAccountName:
      type: string
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9][a-z0-9-]{2,62}$
      description: Unique within the organization.
    TokenName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9 ._:@-]{1,64}$
      description: Human-readable label, 1-64 characters from [A-Za-z0-9 ._:@-].
    Description:
      type: string
      maxLength: 256
      pattern: ^[^\x00-\x1f\x7f]*$
      description: Free text, up to 256 characters, no control characters.
    Role:
      type: string
      enum:
      - owner
      - admin
      - editor
      - reader
      description: reader < editor < admin < owner. owner exists only on organizations, exactly one per organization.
    GrantableRole:
      type: string
      enum:
      - admin
      - editor
      - reader
      description: Roles that can be granted directly. owner is only obtained by organization creation or ownership transfer.
    PrincipalType:
      type: string
      enum:
      - user
      - service_account
    ResourceType:
      type: string
      enum:
      - org
      - zone
      - service_account
    InvitationStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      - revoked
      - expired
    ZoneTransferStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      - cancelled
      - expired
    Ttl:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: Seconds, 0..2^31-1 (RFC 2181 section 8).
    UserZoneName:
      type: string
      minLength: 1
      maxLength: 254
      pattern: ^(?=.{1,253}\.?$)(?!-)(?!.*\.-)(?!.*-\.)(?!.*\.\.)(?!.*\s)[^.*_\\]{1,63}(\.[^.*_\\]{1,63})*\.[Ss][Ll][Oo][Pp]\.?$
      description: 'Zone name a user may register. Must be a strict subdomain of the backend setting USER_ZONE_SUFFIX (default ''slop''): foo.slop and a.b.slop are
        accepted, ''slop'' itself and any name outside it (example.com, fooslop) are rejected with 422 validation_failed, field=name. The pattern reflects the default
        suffix and is only a pre-check; the server applies the full rules: trailing dot optional, case-insensitive, IDN labels converted to punycode (UTS 46), labels
        are LDH (letters, digits, hyphen; no leading or trailing hyphen; no underscore or wildcard), 1-63 octets per label, at most 253 octets without the trailing
        dot, globally unique (409 if taken). The DNS server itself has no name restriction. Shared vectors: proto/testdata/user_zone_names.json.'
    CanonicalZoneName:
      type: string
      minLength: 2
      maxLength: 254
      pattern: ^([a-z0-9-]{1,63}\.)+$
      description: 'Absolute canonical zone name: lower case, punycode, with the trailing dot.'
    OwnerName:
      type: string
      minLength: 1
      maxLength: 254
      pattern: ^(@|\*|(\*\.)?[^.\s*\\]{1,63}(\.[^.\s*\\]{1,63})*\.?)$
      description: Owner name of a record. '@' means the zone apex. A name without a trailing dot is relative to the zone (www, _sip._tcp, *.dev). A name with a trailing
        dot is absolute and must be equal to or below the zone apex. A leading '*' label creates a wildcard (RFC 4592). Labels may contain underscores (RFC 2181 section
        11); IDN labels are converted to punycode. 1-63 octets per label, at most 253 octets for the absolute name. Responses always return the absolute canonical
        form.
    HostName:
      type: string
      minLength: 1
      maxLength: 254
      pattern: ^[^.\s\\]{1,63}(\.[^.\s\\]{1,63})*\.?$
      description: Domain name inside RDATA. Always interpreted as absolute (a trailing dot is optional, never relative to the zone). IDN labels are converted to
        punycode. 1-63 octets per label, at most 253 octets. Responses return the canonical form with the trailing dot.
    HostNameOrRoot:
      type: string
      minLength: 1
      maxLength: 254
      pattern: ^(\.|[^.\s\\]{1,63}(\.[^.\s\\]{1,63})*\.?)$
      description: Like HostName, but '.' (the root) is also accepted, e.g. null MX (RFC 7505), SRV 'service not available' (RFC 2782), NAPTR without replacement
        (RFC 3403).
    CharacterString:
      type: string
      maxLength: 255
      description: 'RFC 1035 <character-string>: at most 255 octets after UTF-8 encoding (checked by the server on bytes).'
    AData:
      type: object
      properties:
        address:
          type: string
          format: ipv4
          maxLength: 15
          pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
          description: Dotted-quad IPv4 address without leading zeros.
      required:
      - address
      additionalProperties: false
      description: RFC 1035 section 3.4.1.
    AAAAData:
      type: object
      properties:
        address:
          type: string
          format: ipv6
          minLength: 2
          maxLength: 45
          pattern: ^[0-9A-Fa-f:.]{2,45}$
          description: IPv6 address (RFC 4291 text form). Returned in RFC 5952 canonical form.
      required:
      - address
      additionalProperties: false
      description: RFC 3596.
    NSData:
      type: object
      properties:
        nsdname:
          $ref: '#/components/schemas/HostName'
      required:
      - nsdname
      additionalProperties: false
      description: RFC 1035 section 3.3.11. The last NS record at the apex cannot be deleted (422).
    CNAMEData:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/HostName'
      required:
      - target
      additionalProperties: false
      description: RFC 1035 section 3.3.1. Not allowed at the apex; cannot coexist with any other record at the same owner (422).
    PTRData:
      type: object
      properties:
        ptrdname:
          $ref: '#/components/schemas/HostName'
      required:
      - ptrdname
      additionalProperties: false
      description: RFC 1035 section 3.3.12.
    MXData:
      type: object
      properties:
        preference:
          type: integer
          minimum: 0
          maximum: 65535
        exchange:
          $ref: '#/components/schemas/HostNameOrRoot'
      required:
      - preference
      - exchange
      additionalProperties: false
      description: RFC 1035 section 3.3.9; exchange '.' with preference 0 is a null MX (RFC 7505).
    TXTData:
      type: object
      properties:
        strings:
          type: array
          minItems: 1
          maxItems: 255
          items:
            $ref: '#/components/schemas/CharacterString'
          description: One or more character-strings; total RDATA at most 65535 octets.
      required:
      - strings
      additionalProperties: false
      description: RFC 1035 section 3.3.14.
    SRVData:
      type: object
      properties:
        priority:
          type: integer
          minimum: 0
          maximum: 65535
        weight:
          type: integer
          minimum: 0
          maximum: 65535
        port:
          type: integer
          minimum: 0
          maximum: 65535
        target:
          $ref: '#/components/schemas/HostNameOrRoot'
      required:
      - priority
      - weight
      - port
      - target
      additionalProperties: false
      description: RFC 2782. Owner is expected to be _service._proto.name; target '.' means the service is not available.
    CAAData:
      type: object
      properties:
        flags:
          type: integer
          enum:
          - 0
          - 128
          description: 0 or 128 (issuer critical).
        tag:
          type: string
          minLength: 1
          maxLength: 15
          pattern: ^[A-Za-z0-9]{1,15}$
          description: RFC 8659 tag, e.g. issue, issuewild, iodef.
        value:
          type: string
          maxLength: 2048
          pattern: ^[\x20-\x7e]*$
          description: Printable ASCII.
      required:
      - flags
      - tag
      - value
      additionalProperties: false
      description: RFC 8659.
    HINFOData:
      type: object
      properties:
        cpu:
          $ref: '#/components/schemas/CharacterString'
        os:
          $ref: '#/components/schemas/CharacterString'
      required:
      - cpu
      - os
      additionalProperties: false
      description: RFC 1035 section 3.3.2.
    SSHFPData:
      type: object
      properties:
        algorithm:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 6
          description: 1 RSA, 2 DSA, 3 ECDSA, 4 Ed25519, 6 Ed448 (RFC 4255, 6594, 7479, 8709).
        fingerprint_type:
          type: integer
          enum:
          - 1
          - 2
          description: 1 SHA-1 (40 hex digits), 2 SHA-256 (64 hex digits).
        fingerprint:
          type: string
          pattern: ^([0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$
          minLength: 40
          maxLength: 64
          description: Length must match fingerprint_type (422 otherwise).
      required:
      - algorithm
      - fingerprint_type
      - fingerprint
      additionalProperties: false
      description: RFC 4255.
    TLSAData:
      type: object
      properties:
        usage:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 255
        selector:
          type: integer
          enum:
          - 0
          - 1
          - 255
        matching_type:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 255
          description: 1 SHA-256 requires 64 hex digits, 2 SHA-512 requires 128 hex digits (422 otherwise).
        certificate_association_data:
          type: string
          minLength: 2
          maxLength: 16384
          pattern: ^([0-9A-Fa-f]{2})+$
      required:
      - usage
      - selector
      - matching_type
      - certificate_association_data
      additionalProperties: false
      description: RFC 6698. Owner is expected to be _port._proto.name.
    DNAMEData:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/HostName'
      required:
      - target
      additionalProperties: false
      description: RFC 6672. At most one DNAME per owner, cannot coexist with CNAME at the same owner, no other names may exist below the owner; allowed at the apex
        (422 otherwise).
    NAPTRData:
      type: object
      properties:
        order:
          type: integer
          minimum: 0
          maximum: 65535
        preference:
          type: integer
          minimum: 0
          maximum: 65535
        flags:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9]*$
        services:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9+:._-]*$
        regexp:
          type: string
          maxLength: 255
          description: Substitution expression; exactly one of regexp (non-empty) and replacement (not '.') must be set (RFC 3403 section 4.1, 422 otherwise).
        replacement:
          $ref: '#/components/schemas/HostNameOrRoot'
      required:
      - order
      - preference
      - flags
      - services
      - regexp
      - replacement
      additionalProperties: false
      description: RFC 3403.
    GPTData:
      type: object
      properties:
        text:
          type: string
          maxLength: 40
          description: UTF-8 text of 0-40 BYTES after UTF-8 encoding (the server checks bytes, not characters); empty string allowed.
      required:
      - text
      additionalProperties: false
      description: 'SlopDNS private type GPT, code 65280 (ADR 0003). Wire format: one character-string.'
    GenericData:
      type: object
      properties:
        rdata:
          type: string
          minLength: 4
          maxLength: 200000
          pattern: ^\\#[ \t]+(0|[1-9][0-9]{0,4})([ \t]+[0-9A-Fa-f]+)*[ \t]*$
          description: 'RFC 3597 section 5 generic form: \# <length> <hex>, length 0..65535 and equal to the number of hex octets (whitespace between hex groups allowed).
            Returned normalized as \# <len> <UPPER-HEX>.'
      required:
      - rdata
      additionalProperties: false
      description: Opaque RDATA in RFC 3597 form (responses only, legacy records).
    GenericRecordType:
      type: string
      minLength: 5
      maxLength: 9
      pattern: ^TYPE[1-9][0-9]{0,4}$
      not:
        anyOf:
        - pattern: ^TYPE(6|41|46|47|50|51)$
        - pattern: ^TYPE(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$
        - pattern: ^TYPE(6553[6-9]|655[4-9][0-9]|65[6-9][0-9]{2}|6[6-9][0-9]{3}|[7-9][0-9]{4})$
      description: RFC 3597 type mnemonic TYPEnnn of a legacy opaque record (responses only). Requests with a TYPEnnn type are rejected with 422 validation_failed,
        field=type.
    ARecordVariant:
      type: object
      title: A record
      properties:
        name:
          $ref: '#/components/schemas/OwnerName'
        type:
          type: string
          const: A
          description: Type code 1.
        ttl:
          $ref: '#/components/schemas/Ttl'
        data:
          $ref: '#/components/schemas/AData'
      required:
      - name
      - type
      - data
    AAAARecordVariant:
      type: object
      title: AAAA record
      properties:
        name:
          $ref: '#/components/schemas/OwnerName'
        type:
          type: string
          const: AAAA
          description: Type code 28.
        ttl:
          $ref: '#/components/schemas/Ttl'
