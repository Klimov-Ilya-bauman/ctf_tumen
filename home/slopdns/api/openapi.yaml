openapi: 3.1.0
info:
  title: SlopDNS public API
  version: 1.0.0
  contact:
    name: SlopDNS team
  description: |-
    Public REST/JSON API of SlopDNS, served by the API gateway under /api/v1 and used by both the SPA and scripts.

    Authentication: session cookie slopdns_session (UI) or Authorization: Bearer with a personal token (sdpat_...) or service account token (sdsat_...). Cookie-authenticated mutating requests must send X-SlopDNS-CSRF: 1. Service accounts work only with tokens and cannot use session-only endpoints (auth/totp, users/me/tokens, createOrg).

    Validation: request bodies are strict JSON (unknown fields -> 400). Every field constraint below is enforced by the server; violations return 422 with error.field. Objects outside the caller's organizations are reported as 404, insufficient role on a visible object as 403.

    Lists use limit/offset pagination and return {items, total, limit, offset}.
servers:
- url: /api/v1
security:
- sessionCookie: []
- bearerToken: []
tags:
- name: auth
  description: Registration, login, TOTP.
- name: tokens
  description: Personal API tokens.
- name: orgs
  description: Organizations and members.
- name: invitations
  description: Organization invitations.
- name: role-bindings
  description: Roles on organizations, zones and service accounts.
- name: service-accounts
  description: Service accounts and their tokens.
- name: zones
  description: DNS zones.
- name: records
  description: DNS records.
- name: zone-transfers
  description: Transferring zones between users and organizations.
- name: health
  description: Liveness and readiness.
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a user
      tags:
      - auth
      description: Creates the user and, through Backend EnsureDefaultOrg, the organization named <username>-org owned by the user (organization names are display labels and need not be unique).
        Does not log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      tags:
      - auth
      description: 'Wrong credentials return 401 invalid_credentials, identical for unknown users. Wrong passwords are not counted per user and never lock the account. 429 rate_limited (with Retry-After) is returned only when the global password hashing pool of IAM stays saturated for ARGON2_QUEUE_TIMEOUT.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in or second factor required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: slopdns_session=<sdses token>; HttpOnly; SameSite=Strict; Path=/ (plus Secure when SESSION_COOKIE_SECURE=true).
              schema:
                type: string
                maxLength: 512
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/login/totp:
    post:
      operationId: loginTotp
      summary: Second login step with a TOTP or recovery code
      tags:
      - auth
      description: 'Consumes the mfa_token. A used recovery code is marked and never accepted again. One mfa_token allows at most 5 second-factor attempts: after 5 wrong codes (TOTP or recovery) it is invalid (401 mfa_invalid, even for a correct code) and the user starts again with POST /auth/login. This is not an account lockout.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTotpRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
          headers:
            Set-Cookie:
              description: slopdns_session=<sdses token>; HttpOnly; SameSite=Strict; Path=/ (plus Secure when SESSION_COOKIE_SECURE=true).
              schema:
                type: string
                maxLength: 512
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: Log out (revoke the current session)
      tags:
      - auth
      description: Revokes the session and clears the cookie. With a bearer token it is a no-op returning 204.
      parameters:
      - $ref: '#/components/parameters/csrf'
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              description: slopdns_session=<sdses token>; HttpOnly; SameSite=Strict; Path=/ (plus Secure when SESSION_COOKIE_SECURE=true).
              schema:
                type: string
                maxLength: 512
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me:
    get:
      operationId: getMe
      summary: Current principal
      tags:
      - auth
      description: Current principal.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/totp/setup:
    post:
      operationId: totpSetup
      summary: Start TOTP enrollment
      tags:
      - auth
      description: Generates and stores a new pending secret (replacing a previous pending one). 409 if TOTP is already enabled. Users only.
      parameters:
      - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/totp/enable:
    post:
      operationId: totpEnable
      summary: Confirm TOTP enrollment
      tags:
      - auth
      description: Verifies a code for the pending secret, enables TOTP and issues 10 recovery codes (shown once). 409 if there is no pending secret or TOTP is already
        enabled.
      parameters:
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/totp/disable:
    post:
      operationId: totpDisable
      summary: Disable TOTP
      tags:
      - auth
      description: Requires the password and a valid TOTP code or recovery code. Deletes the secret and all recovery codes.
      parameters:
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Regenerate TOTP recovery codes
      tags:
      - auth
      description: Requires the password and a valid TOTP code. Invalidates all previous recovery codes.
      parameters:
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodesRegenerateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/tokens:
    get:
      operationId: listMyTokens
      summary: List my API tokens
      tags:
      - tokens
      description: Active and expired (not revoked) personal API tokens of the calling user. Users only.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createMyToken
      summary: Create a personal API token
      tags:
      - tokens
      description: 'The token acts on behalf of the user with the user''s current permissions. Can only be created with a session (403 for API tokens and service accounts). Requires totp_code when TOTP is enabled (401 mfa_invalid when missing or wrong). Each session allows at most 5 wrong totp_code values across token creations: the 5th wrong code revokes the session (log in again); the account is not locked.'
      parameters:
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenCreate'
      responses:
        '201':
          description: Created. The token is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/tokens/{token_id}:
    delete:
      operationId: revokeMyToken
      summary: Revoke a personal API token
      tags:
      - tokens
      description: Takes effect on the next request.
      parameters:
      - $ref: '#/components/parameters/token_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs:
    get:
      operationId: listOrgs
      summary: List organizations I am a member of
      tags:
      - orgs
      description: List organizations I am a member of.
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createOrg
      summary: Create an organization
      tags:
      - orgs
      description: Create an organization. At most MAX_ORGS_PER_USER (default 20) organizations created by the caller may exist, including the default organization
        (422 quota_exceeded, field=name).
      parameters:
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}:
    get:
      operationId: getOrg
      summary: Get an organization
      tags:
      - orgs
      description: Get an organization.
      parameters:
      - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateOrg
      summary: Rename an organization
      tags:
      - orgs
      description: Requires admin on the organization.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteOrg
      summary: Delete an organization
      tags:
      - orgs
      description: Owner only. The organization must not contain zones (409). Its service accounts, tokens, role bindings and pending invitations are removed.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}/members:
    get:
      operationId: listOrgMembers
      summary: List organization members
      tags:
      - orgs
      description: Requires reader on the organization. A member is any principal with at least one role binding in the organization.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}/members/{user_id}:
    delete:
      operationId: removeOrgMember
      summary: Remove a user from an organization
      tags:
      - orgs
      description: Requires admin on the organization. Revokes all bindings of the user in the organization. The owner cannot be removed (403). A user may remove
        themselves (leave), except the owner.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/user_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}/transfer-ownership:
    post:
      operationId: transferOrgOwnership
      summary: Transfer organization ownership
      tags:
      - orgs
      description: Owner only. The target must be a user member of the organization (422). The previous owner becomes admin.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}/invitations:
    get:
      operationId: listOrgInvitations
      summary: List invitations of an organization
      tags:
      - invitations
      description: Requires admin on the organization.
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/invitation_status'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createInvitation
      summary: Invite a user to an organization
      tags:
      - invitations
      description: Requires admin on the organization. The invitee must be a registered user who is not yet an organization-level member (409) and has no pending
        invitation to this organization (409). Expires after 7 days. At most MAX_PENDING_INVITATIONS_PER_ORG (default 100) pending invitations per organization
        (422 quota_exceeded, field=org_id).
      parameters:
      - $ref: '#/components/parameters/org_id'
      - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations:
    get:
      operationId: listMyInvitations
      summary: List invitations addressed to me
      tags:
      - invitations
      description: List invitations addressed to me.
      parameters:
      - $ref: '#/components/parameters/invitation_status'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{invitation_id}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      tags:
      - invitations
      description: Invitee only. Grants the invited role on the organization. 409 if the invitation is not pending (accepted, declined, revoked or expired).
      parameters:
      - $ref: '#/components/parameters/invitation_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{invitation_id}/decline:
    post:
      operationId: declineInvitation
      summary: Decline an invitation
      tags:
      - invitations
      description: Invitee only. 409 if not pending.
      parameters:
      - $ref: '#/components/parameters/invitation_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{invitation_id}/revoke:
    post:
      operationId: revokeInvitation
      summary: Revoke an invitation
      tags:
      - invitations
      description: Requires admin on the organization. 409 if not pending.
      parameters:
      - $ref: '#/components/parameters/invitation_id'
      - $ref: '#/components/parameters/csrf'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /role-bindings:
    get:
      operationId: listRoleBindings
      summary: List role bindings
      tags:
      - role-bindings
      description: Either resource_type with resource_id (bindings on that object, requires reader on it) or org_id (all bindings in the organization, requires reader
