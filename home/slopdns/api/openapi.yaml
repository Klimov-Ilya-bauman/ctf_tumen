    GenericRecordVariant:
      type: object
      title: Generic record (read-only, legacy)
      description: Response-only representation of an opaque record stored before the generic RFC 3597 input form was removed. Never accepted in requests.
      properties:
        name:
          $ref: '#/components/schemas/OwnerName'
        type:
          $ref: '#/components/schemas/GenericRecordType'
        ttl:
          $ref: '#/components/schemas/Ttl'
        data:
          $ref: '#/components/schemas/GenericData'
      required:
      - name
      - type
      - data
    RecordVariant:
      oneOf:
      - $ref: '#/components/schemas/ARecordVariant'
      - $ref: '#/components/schemas/AAAARecordVariant'
      - $ref: '#/components/schemas/NSRecordVariant'
      - $ref: '#/components/schemas/CNAMERecordVariant'
      - $ref: '#/components/schemas/PTRRecordVariant'
      - $ref: '#/components/schemas/MXRecordVariant'
      - $ref: '#/components/schemas/TXTRecordVariant'
      - $ref: '#/components/schemas/SRVRecordVariant'
      - $ref: '#/components/schemas/CAARecordVariant'
      - $ref: '#/components/schemas/HINFORecordVariant'
      - $ref: '#/components/schemas/SSHFPRecordVariant'
      - $ref: '#/components/schemas/TLSARecordVariant'
      - $ref: '#/components/schemas/DNAMERecordVariant'
      - $ref: '#/components/schemas/NAPTRRecordVariant'
      - $ref: '#/components/schemas/GPTRecordVariant'
      description: 'Discriminated union on ''type''. Only the named types below can be created or replaced; the generic RFC 3597 form (type TYPEnnn with \#
        hex RDATA) is not accepted (422 validation_failed, field=type). Each variant fixes the shape of ''data''. ttl defaults to the zone default_ttl. SOA is not a record type here:
        it is managed through zone soa settings. All records with the same (name, type) form an RRSet that has one TTL (RFC 2181 section 5.2): creating or updating
        a record with a ttl sets that ttl on the whole RRSet. Duplicate records (same name, type and RDATA) are rejected with 409. CNAME/DNAME/NS-apex integrity rules
        are rejected with 422.'
    RecordInput:
      allOf:
      - $ref: '#/components/schemas/RecordVariant'
      unevaluatedProperties: false
      description: Request body for creating or replacing a record.
    RecordMeta:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        zone_id:
          $ref: '#/components/schemas/Uuid'
        type_code:
          type: integer
          minimum: 1
          maximum: 65535
          readOnly: true
        ttl:
          $ref: '#/components/schemas/Ttl'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - zone_id
      - type_code
      - ttl
      - created_at
      - updated_at
    Record:
      allOf:
      - $ref: '#/components/schemas/RecordMeta'
      - oneOf:
        - $ref: '#/components/schemas/RecordVariant'
        - $ref: '#/components/schemas/GenericRecordVariant'
      unevaluatedProperties: false
      description: Stored record. name is absolute canonical, ttl is always present, type is the mnemonic for structured types. TYPEnnn with GenericData appears
        only for opaque records stored before generic input was removed; such records can be read and deleted but not created or replaced.
    SoaInput:
      type: object
      properties:
        mname:
          $ref: '#/components/schemas/HostName'
        rname:
          allOf:
          - $ref: '#/components/schemas/HostName'
          description: Responsible mailbox in domain-name form (hostmaster.example.slop.), RFC 1035 section 8.
        refresh:
          type: integer
          minimum: 60
          maximum: 2147483647
        retry:
          type: integer
          minimum: 60
          maximum: 2147483647
        expire:
          type: integer
          minimum: 60
          maximum: 2147483647
        minimum:
          type: integer
          minimum: 0
          maximum: 86400
      additionalProperties: false
      description: 'Optional SOA settings. Omitted fields keep their current value (or the backend default on creation). serial is never set by clients: it is incremented
        by every change of the zone.'
      minProperties: 1
    Soa:
      type: object
      properties:
        mname:
          type: string
          maxLength: 254
        rname:
          type: string
          maxLength: 254
        serial:
          type: integer
          minimum: 0
          maximum: 4294967295
          readOnly: true
        refresh:
          type: integer
          minimum: 60
          maximum: 2147483647
        retry:
          type: integer
          minimum: 60
          maximum: 2147483647
        expire:
          type: integer
          minimum: 60
          maximum: 2147483647
        minimum:
          type: integer
          minimum: 0
          maximum: 86400
      required:
      - mname
      - rname
      - serial
      - refresh
      - retry
      - expire
      - minimum
      additionalProperties: false
    ZoneCreate:
