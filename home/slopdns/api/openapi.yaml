      - role
      additionalProperties: false
    RoleBindingCreate:
      oneOf:
      - $ref: '#/components/schemas/RoleBindingCreateByPrincipal'
      - $ref: '#/components/schemas/RoleBindingCreateByUsername'
      description: 'Requires admin on the resource. The granted role must not exceed admin and the caller cannot raise their own role (403). Service accounts can
        only receive roles on objects of their own organization (422). A user who is not yet a member of the resource''s organization cannot receive any
        role (organization, zone or service account): invite them first (422). A second binding for the same principal and resource is rejected with 409; use PATCH to change the role.'
