# Per-client defensive limits; these are not tournament rate-limit values.
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=register_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    client_body_timeout 10s;
    send_timeout 20s;
    limit_req_status 429;
    # The observed source address may be a shared tournament gateway.
    # Record excess requests without rejecting unrelated clients/checkers.
    limit_req_dry_run on;
    add_header X-Content-Type-Options nosniff always;

    location = /api/login {
        limit_req zone=login_per_ip burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }

    location = /api/register {
        limit_req zone=register_per_ip burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
