<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homomorphic Go</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<header class="topbar"><a class="brand" href="index.html">Homomorphic Go</a></header>
<main class="center">
  <form class="panel auth" id="auth-form" autocomplete="off">
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="row">
      <button id="login-btn" type="submit">Log in</button>
      <button id="register-btn" type="button" class="secondary">Register</button>
    </div>
    <p id="auth-error" class="error" role="alert"></p>
  </form>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
