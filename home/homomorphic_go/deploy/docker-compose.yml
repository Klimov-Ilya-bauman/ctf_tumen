services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hgo}
      POSTGRES_DB: ${POSTGRES_DB:-hgo}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hgo}:${POSTGRES_PASSWORD:-hgo}@db:5432/${POSTGRES_DB:-hgo}?sslmode=disable
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-}
      LISTEN_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    # Dev only: expose the API directly (the frontend already proxies /api/).
    # ports: ["8080:8080"]
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
